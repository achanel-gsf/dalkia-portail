<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portail Dalkia - Kaly</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        /* ================================
           PAGE
        ================================= */

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================================
           EN-TETE
        ================================= */

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logos {
            max-width: 650px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            max-height: 60px;
            max-width: 160px;
            object-fit: contain;
        }

        /* ================================
           CONTENU
        ================================= */

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        /* ================================
           LOCAL
        ================================= */

        .site {
            color: #777;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            color: #d20a2e;
            font-size: 28px;
            line-height: 1.25;
            margin: 0 0 8px 0;
        }

        .etage {
            font-size: 19px;
            color: #555;
            margin-bottom: 30px;
        }

        .separator {
            height: 1px;
            background: #eeeeee;
            margin: 25px 0 30px 0;
        }

        /* ================================
           BOUTONS
        ================================= */

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 17px 20px;
            border-radius: 10px;
            text-decoration: none;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            font-size: 16px;
            font-weight: bold;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* OPTIMA */

        .btn-intervention {
            background: #d20a2e;
            color: white;

            box-shadow:
                0 4px 12px rgba(210, 10, 46, 0.20);
        }

        .btn-intervention:hover {
            box-shadow:
                0 7px 16px rgba(210, 10, 46, 0.28);
        }

        /* PLANNING */

        .btn-planning {
            border: 2px solid #d20a2e;
            color: #d20a2e;
            background: white;
        }

        .btn-planning:hover {
            background: #fff5f6;
        }

        /* ================================
           MESSAGE ERREUR
        ================================= */

        .error {
            display: none;
        }

        .error h1 {
            margin-bottom: 15px;
        }

        .error p {
            color: #666;
            line-height: 1.5;
        }

        .local-code {
            display: inline-block;

            margin-top: 10px;
            padding: 7px 10px;

            background: #f1f1f1;
            border-radius: 6px;

            font-family: monospace;
            font-size: 13px;

            word-break: break-all;
        }

        /* ================================
           PIED DE PAGE
        ================================= */

        footer {
            padding: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            header {
                padding: 16px;
            }

            .logos {
                gap: 20px;
            }

            .logo {
                max-width: 120px;
                max-height: 50px;
            }

            main {
                padding: 25px 15px;
            }

            .card {
                padding: 30px 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 25px;
            }

            .etage {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <!-- ===============================
         LOGOS
    ================================ -->

    <header>

        <div class="logos">

            <img
                src="logos/gsf.png"
                alt="GSF"
                class="logo"
            >

            <img
                src="logos/dalkia.png"
                alt="Dalkia"
                class="logo"
            >

        </div>

    </header>


    <!-- ===============================
         CONTENU
    ================================ -->

    <main>

        <!-- LOCAL TROUVE -->

        <div class="card" id="localCard">

            <div class="site">
                KALY
            </div>

            <h1 id="localNom">
                Chargement...
            </h1>

            <div
                class="etage"
                id="localEtage">
            </div>

            <div class="separator"></div>


            <div class="actions">

                <!-- OPTIMA -->

                <a
                    id="interventionBtn"
                    class="btn btn-intervention"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span>🔧</span>

                    <span>
                        Demander une intervention
                    </span>

                </a>


                <!-- PLANNING -->

                <a
                    id="planningBtn"
                    class="btn btn-planning"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span>📅</span>

                    <span>
                        Consulter le planning d'intervention
                    </span>

                </a>

            </div>

        </div>


        <!-- LOCAL INCONNU -->

        <div
            class="card error"
            id="errorCard"
        >

            <div class="site">
                KALY
            </div>

            <h1>
                Local non reconnu
            </h1>

            <p>
                Le QR code utilisé ne correspond pas
                à un local enregistré.
            </p>

            <p>
                Identifiant détecté :
            </p>

            <div
                class="local-code"
                id="errorCode">
            </div>

        </div>

    </main>


    <!-- ===============================
         FOOTER
    ================================ -->

    <footer>

        Portail d'intervention Kaly

    </footer>

</div>


<!-- ===============================
     CONFIGURATION DES LOCAUX
================================ -->

<script src="locaux.js"></script>


<script>

    /*
    ==========================================
    RECUPERATION DU PARAMETRE DU QR CODE
    ==========================================
    Exemple :

    ?local=kaly-r1-sdr-cedre
    */

    const params =
        new URLSearchParams(window.location.search);

    const localId =
        params.get("local");


    /*
    ==========================================
    ELEMENTS DE LA PAGE
    ==========================================
    */

    const localCard =
        document.getElementById("localCard");

    const errorCard =
        document.getElementById("errorCard");

    const localNom =
        document.getElementById("localNom");

    const localEtage =
        document.getElementById("localEtage");

    const interventionBtn =
        document.getElementById("interventionBtn");

    const planningBtn =
        document.getElementById("planningBtn");

    const errorCode =
        document.getElementById("errorCode");


    /*
    ==========================================
    RECHERCHE DU LOCAL
    ==========================================
    */

    if (
        localId &&
        typeof locaux !== "undefined" &&
        locaux[localId]
    ) {

        const local =
            locaux[localId];


        /*
        --------------------------
        NOM DU LOCAL
        --------------------------
        */

        localNom.textContent =
            local.nom;


        /*
        --------------------------
        ETAGE
        --------------------------
        */

        localEtage.textContent =
            local.etage || "";


        /*
        --------------------------
        LIEN OPTIMA
   ------------
        */

        document.title =
            local.nom +
            " - " +
            local.etage +
            " | Kaly";


    } else {


        /*
        ==========================================
        QR CODE INCONNU
        ==========================================
        */

        localCard.style.display =
            "none";

        errorCard.style.display =
            "block";

        errorCode.textContent =
            localId || "aucun identifiant";

    }

</script>


</body>

</html>
