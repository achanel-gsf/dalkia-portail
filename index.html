<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portail Dalkia - Kaly</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f6f8;
            color: #252525;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           CONTENEUR PRINCIPAL
        ========================= */

        .container {
            width: 100%;
            max-width: 500px;

            margin: 20px;
            padding: 30px 25px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);

            text-align: center;
        }


        /* =========================
           LOGOS
        ========================= */

        .logos {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 25px;

            margin-bottom: 30px;
        }

        .logos img {
            max-width: 140px;
            max-height: 65px;
            object-fit: contain;
        }


        /* =========================
           SITE
        ========================= */

        .site {
            color: #555;
            font-size: 15px;

            margin-bottom: 8px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* =========================
           NOM DU LOCAL
        ========================= */

        h1 {
            margin: 0;

            font-size: 27px;
            line-height: 1.2;

            color: #d71920;
        }


        /* =========================
           ETAGE
        ========================= */

        .etage {
            margin-top: 8px;

            font-size: 18px;
            font-weight: bold;

            color: #555;
        }


        /* =========================
           SEPARATEUR
        ========================= */

        .separator {
            width: 60px;
            height: 4px;

            background: #d71920;

            border-radius: 10px;

            margin: 22px auto;
        }


        /* =========================
           TEXTE
        ========================= */

        .description {
            font-size: 16px;
            line-height: 1.5;

            color: #555;

            margin-bottom: 25px;
        }


        /* =========================
           BOUTONS
        ========================= */

        .button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 65px;

            margin-top: 15px;

            padding: 15px 20px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .button:active {
            transform: scale(0.98);
        }


        /* =========================
           BOUTON INTERVENTION
        ========================= */

        .intervention {
            background: #d71920;
            color: white;

            box-shadow:
                0 4px 12px rgba(215, 25, 32, 0.25);
        }


        /* =========================
           BOUTON PLANNING
        ========================= */

        .planning {
            background: #ffffff;
            color: #d71920;

            border: 2px solid #d71920;
        }


        /* =========================
           ICONES
        ========================= */

        .icon {
            font-size: 25px;

            margin-right: 12px;
        }


        /* =========================
           PIED DE PAGE
        ========================= */

        .footer {
            margin-top: 30px;

            padding-top: 18px;

            border-top: 1px solid #eeeeee;

            font-size: 12px;
            color: #999;
        }


        /* =========================
           ERREUR
        ========================= */

        .error {
            display: none;

            margin-top: 20px;

            padding: 20px;

            background: #fff3f3;

            border: 1px solid #f0b5b5;
            border-radius: 10px;

            color: #a40000;

            font-size: 15px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 450px) {

            .container {
                margin: 12px;
                padding: 25px 20px;
            }

            .logos img {
                max-width: 115px;
                max-height: 55px;
            }

            h1 {
                font-size: 24px;
            }

            .button {
                font-size: 16px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- =========================
             LOGOS
        ========================== -->

        <div class="logos">

            <img
                src="logos/gsf.png"
                alt="Logo GSF"
            >

            <img
                src="logos/dalkia.png"
                alt="Logo Dalkia"
            >

        </div>


        <!-- =========================
             CONTENU DU LOCAL
        ========================== -->

        <div id="contenu">

            <div class="site">
                Dalkia • Kaly
            </div>


            <h1 id="nomLocal">
                Chargement...
            </h1>


            <div
                class="etage"
                id="etageLocal"
            ></div>


            <div class="separator"></div>


            <div class="description">
                Sélectionnez l'action souhaitée.
            </div>


            <!-- INTERVENTION -->

            <a
                id="btnIntervention"
                class="button intervention"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    🔧
                </span>

                <span>
                    Demander une intervention
                </span>

            </a>


            <!-- PLANNING -->

            <a
                id="btnPlanning"
                class="button planning"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">
                    📅
                </span>

                <span>
                    Consulter le planning d'intervention
                </span>

            </a>

        </div>


        <!-- =========================
             MESSAGE D'ERREUR
        ========================== -->

        <div
            id="erreur"
            class="error"
        >

            <strong>Local non reconnu</strong>

            <br><br>

            Le QR code utilisé ne correspond pas à un local configuré.

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">

            Portail d'intervention – Kaly

            <br>

            GSF × Dalkia

        </div>

    </div>


    <!-- =========================
         CONFIGURATION DES LOCAUX
    ========================== -->

    <script src="locaux.js"></script>


    <!-- =========================
         SCRIPT PRINCIPAL
    ========================== -->

        /*
        ==========================================
        RÉCUPÉRATION DU LOCAL DANS L'URL
        ==========================================

        ?local=kaly-r1-sdr-cedre

        */

            /*

            */

            if (local.intervention) {

        */

        else {

            erreur.style.display =

        }

    </script>

</body>
</html>
